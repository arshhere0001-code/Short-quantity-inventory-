<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polishing Short Quantity Inventory</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--tx:#10132b;--mut:#6b7090;--bd:#d9dce8;--pri:#000042;--pt:#fff;--in:#16a34a;--out:#e11d48;--alt:#f8f9fc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--card:#161a2e;--tx:#e8eaf6;--mut:#9aa0c3;--bd:#2c3250;--pri:#8f9bff;--pt:#0d0f1c;--in:#34d399;--out:#fb7185;--alt:#1a1f36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1c;--card:#161a2e;--tx:#e8eaf6;--mut:#9aa0c3;--bd:#2c3250;--pri:#8f9bff;--pt:#0d0f1c;--in:#34d399;--out:#fb7185;--alt:#1a1f36;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:6px 12px;border:1px solid var(--bd)}.logo img{height:34px;display:block}
h1{font-size:18px;margin:0;font-weight:650}.sub{color:var(--mut);font-size:12px}
main{max-width:1000px;margin:0 auto;padding:18px 14px 40px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;font:inherit;font-weight:650;font-size:16px}
.tab.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--pri);outline-offset:-1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.big input{font-size:20px;padding:12px}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kb{padding:14px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--mut);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.kb.i.on{background:var(--in);border-color:var(--in);color:#fff}.kb.o.on{background:var(--out);border-color:var(--out);color:#fff}
.save{width:100%;padding:15px;border-radius:10px;border:0;background:var(--pri);color:var(--pt);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
button.b{font:inherit;font-weight:550;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.bar input{width:auto}
.sheet{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:var(--pri);color:var(--pt);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;text-align:left;position:sticky;top:0;border:1px solid var(--bd)}
td{padding:7px 10px;border:1px solid var(--bd)}tbody tr:nth-child(even){background:var(--alt)}
td.n,th.n{text-align:right}td.r{color:var(--mut);text-align:center;width:48px}
.pi{color:var(--in);font-weight:600}.po{color:var(--out);font-weight:600}tfoot td{font-weight:700;background:var(--alt);position:sticky;bottom:0}
.neg{color:var(--out);font-weight:700}.low{background:#dc2626;color:#fff}.x{background:none;border:0;color:var(--out);cursor:pointer;font-size:16px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pt);padding:10px 20px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;font-weight:600}#toast.s{opacity:1}
.warnbox{background:rgba(245,158,11,.16);border:1px solid #f59e0b;color:var(--tx);padding:10px 12px;border-radius:8px;margin-top:12px;font-size:14px;font-weight:600}.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-weight:600}footer{text-align:center;color:var(--mut);font-size:12px;padding:10px}.hide{display:none}
</style></head><body>

<section id="pe">
<div class="card big">

<div><label>SIZE</label><input id="s" list="sl" autocomplete="off" placeholder="e.g. M" oninput="chk()"></div>

</div>
<datalist id="ml"></datalist><datalist id="sl"></datalist>
<div class="card"><b>Recent entries</b><div class="sheet" style="margin-top:8px;max-height:300px"><table><thead><tr><th>Date</th><th>Model</th><th>Size</th><th>Type</th><th class="n">Qty</th><th></th></tr></thead><tbody id="rc"></tbody></table></div></div>
</section>

<section id="ps" class="hide">

</section>

<script>

function addMS(m,s){(MS[m]=MS[m]||new Set()).add(s)}
for(const k in ML)ML[k].split(',').forEach(m=>addMS(m.trim(),k=='_'?'':k));

const $=i=>document.getElementById(i),td=()=>new Date().toLocaleDateString('en-CA'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.tx)S=x}catch(e){}
(S.extra||[]).forEach(e=>addMS(e[0],e[1]));
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save in this browser')}}
function toast(t){const e=$('toast');e.textContent=t;e.className='s';clearTimeout(tm);tm=setTimeout(()=>e.className='',1800)}
const kk=(m,s)=>m+'|'+s,net=t=>t.k=='in'?t.q:-t.q;
const srt=(a,b)=>a.m.localeCompare(b.m,undefined,{numeric:true})||a.s.localeCompare(b.s,undefined,{numeric:true});
let hvw=1;
function chk(){const m=$('m').value.trim().toUpperCase(),s=$('s').value.trim().toUpperCase(),w=$('wn');let t='';
 if(m){const z=MS[m];if(!z)t='⚠ Model '+m+' is not in the list. Please check the number.';else if(s&&!z.has(s)&&!z.has(''))t='⚠ Size '+s+' is not listed for model '+m+'. Listed sizes: '+[...z].filter(Boolean).join(', ')}
 w.textContent=t;w.classList.toggle('hide',!t)}
function hv(n){hvw=n;$('hv1').classList.toggle('p',n==1);$('hv2').classList.toggle('p',n==2);$('hf').classList.toggle('hide',n==1);hs()}
function hs(){const q=$('hq').value.trim().toUpperCase(),H=$('hh'),B=$('hb');let a=0,b=0,n;
 if(hvw==1){const M={};S.tx.forEach(t=>{const r=M[kk(t.m,t.s)]=M[kk(t.m,t.s)]||{m:t.m,s:t.s,i:0,u:0};if(t.k=='in')r.i+=t.q;else r.u+=t.q});
  const L=Object.values(M).filter(r=>!q||(r.m+' '+r.s).includes(q)).sort(srt);
  H.innerHTML='<tr><th>#</th><th>Model No.</th><th>Size</th><th class="n">Total In</th><th class="n">Total Out</th><th class="n">Stock Now</th></tr>';
  B.innerHTML=L.map((r,k)=>{const c=r.i-r.u;a+=r.i;b+=r.u;return `<tr><td class="r">${k+1}</td><td><b>${esc(r.m)}</b></td><td>${esc(r.s)||'—'}</td><td class="n pi">${r.i}</td><td class="n po">${r.u}</td><td class="n ${c<30?'low':''}"><b>${c}</b></td></tr>`}).join('');n=L.length+' models'}
 else{const t1=$('ht').value,d1=$('h1').value,d2=$('h2').value;
  const L=S.tx.filter(t=>(!t1||t.k==t1)&&(!d1||t.d>=d1)&&(!d2||t.d<=d2)&&(!q||(t.m+' '+t.s).includes(q))).sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
  H.innerHTML='<tr><th>Date</th><th>Model No.</th><th>Size</th><th>Type</th><th class="n">Qty</th><th></th></tr>';
  B.innerHTML=L.map(t=>{if(t.k=='in')a+=t.q;else b+=t.q;return `<tr><td>${t.d}</td><td><b>${esc(t.m)}</b></td><td>${esc(t.s)||'—'}</td><td class="${t.k=='in'?'pi':'po'}">${t.k.toUpperCase()}</td><td class="n">${t.q}</td><td><button class="x" title="Delete" onclick="del(${t.id})">✕</button></td></tr>`}).join('');n=L.length+' entries'}
 if(!B.innerHTML)B.innerHTML='<tr><td colspan="6" class="sub" style="padding:16px">Nothing found.</td></tr>';
 $('hsum').innerHTML=`<span class="chip">${n}</span><span class="chip pi">IN: ${a}</span><span class="chip po">OUT: ${b}</span><span class="chip">${hvw==1?'Stock: ':'Net: '}${a-b}</span>`}
function sk(k){kind=k;$('ki').classList.toggle('on',k=='in');$('ko').classList.toggle('on',k=='out')}

function lists(){$('ml').innerHTML=[...new Set([...S.tx.map(t=>t.m),...Object.keys(MS)])].map(m=>`<option value="${esc(m)}">`).join('')}
function ent(){const m=$('m').value.trim().toUpperCase(),s=$('s').value.trim().toUpperCase(),q=parseInt($('q').value),d=$('ed').value||td();
 if(!m)return toast('Enter model no.');if(!q||q<1)return toast('Enter quantity');
 const z=MS[m],bad=!z?'Model '+m+' is not in your list.':(s&&!z.has(s)&&!z.has('')?'Size '+s+' is not listed for model '+m+'.':'');
 if(bad){if(!confirm('⚠ '+bad+'\n\nPress OK to save anyway and add it to your list.\nPress Cancel to go back and check.'))return;addMS(m,s);S.extra=S.extra||[];S.extra.push([m,s])}
 if(kind=='out'){const b=S.tx.filter(t=>t.m==m&&t.s==s).reduce((a,t)=>a+net(t),0);if(q>b&&!confirm('Only '+b+' in stock for '+m+(s?' / '+s:'')+'. Save OUT of '+q+' anyway?'))return}
 S.tx.push({id:++S.n,d,m,s,k:kind,q});save();
 toast((kind=='in'?'IN ':'OUT ')+q+' saved · '+m+(s?' / '+s:''));
 ['m','s','q'].forEach(i=>$(i).value='');lists();szl();chk();rc();$('m').focus()}
function rc(){$('rc').innerHTML=S.tx.slice(-10).reverse().map(t=>`<tr><td>${t.d}</td><td><b>${esc(t.m)}</b></td><td>${esc(t.s)||'—'}</td><td class="${t.k=='in'?'pi':'po'}">${t.k.toUpperCase()}</td><td class="n">${t.q}</td><td><button class="x" title="Delete" onclick="del(${t.id})">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="sub">No entries yet.</td></tr>'}
function del(id){if(!confirm('Delete this entry?'))return;S.tx=S.tx.filter(t=>t.id!=id);save();rc();if(!$('ph').classList.contains('hide'))hs();toast('Entry deleted')}
function mv(n){const x=new Date($('sd').value+'T00:00');x.setDate(x.getDate()+n);$('sd').value=x.toLocaleDateString('en-CA');sh()}

 S.tx.forEach(t=>{if(t.d>d)return;const r=M[kk(t.m,t.s)]=M[kk(t.m,t.s)]||{m:t.m,s:t.s,o:0,i:0,u:0};
  if(t.d<d)r.o+=net(t);else if(t.k=='in')r.i+=t.q;else r.u+=t.q});
 if($('sa').checked)for(const m in MS)MS[m].forEach(s=>{M[kk(m,s)]=M[kk(m,s)]||{m,s,o:0,i:0,u:0}});
 rows=Object.values(M).filter(r=>!f||(r.m+' '+r.s).includes(f)).sort((a,b)=>a.m.localeCompare(b.m,undefined,{numeric:true})||a.s.localeCompare(b.s,undefined,{numeric:true}));
 let to=0,ti=0,tu=0;
 $('sb').innerHTML=rows.map((r,k)=>{const c=r.o+r.i-r.u;to+=r.o;ti+=r.i;tu+=r.u;
  return `<tr><td class="r">${k+1}</td><td><b>${esc(r.m)}</b></td><td>${esc(r.s)||'—'}</td><td class="n">${r.o}</td><td class="n ${r.i?'pi':''}">${r.i||''}</td><td class="n ${r.u?'po':''}">${r.u||''}</td><td class="n ${c<30?'low':''}"><b>${c}</b></td></tr>`}).join('')||'<tr><td colspan="7" class="sub" style="padding:16px">No stock data up to this date.</td></tr>';
 $('sf').innerHTML=`<tr><td></td><td colspan="2">TOTAL</td><td class="n">${to}</td><td class="n">${ti}</td><td class="n">${tu}</td><td class="n">${to+ti-tu}</td></tr>`}
async function dl(name,data){try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data})}else{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([data]));l.download=name;document.body.appendChild(l);l.click();l.remove()}toast('File saved')}catch(e){if(!e||e.code!='declined')toast('Download failed')}}

 rows.forEach((r,k)=>a.push([k+1,r.m,r.s,r.o,r.i,r.u,r.o+r.i-r.u]));
 if(n){const t=['','TOTAL',''];[['D',3],['E',4],['F',5],['G',6]].forEach(([c,i])=>t.push({t:'n',f:'SUM('+c+'5:'+c+(4+n)+')',v:a.slice(4).reduce((s,r)=>s+r[i],0)}));a.push(t)}
 const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:6},{wch:14},{wch:10},{wch:12},{wch:10},{wch:10},{wch:14}];ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:6}}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Inventory');

const bd={style:'thin',color:{argb:'FFC9CEDF'}},BD={top:bd,left:bd,bottom:bd,right:bd},F=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}}),C={horizontal:'center',vertical:'middle'},W='FFFFFFFF';

if(n)ws.addConditionalFormatting({ref:'G5:G'+(4+n),rules:[{type:'cellIs',operator:'lessThan',priority:1,formulae:[30],style:{font:{bold:true,color:{argb:W}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFDC2626'},bgColor:{argb:'FFDC2626'}}}}]});
ws.addRow([]);const N=ws.addRow(['Red box = closing stock below 30 (refill needed)']);ws.mergeCells('A'+N.number+':G'+N.number);N.getCell(1).font={italic:true,size:10,color:{argb:'FFDC2626'}};
dl('Polishing-Inventory-'+d+'.xlsx',await wb.xlsx.writeBuffer())}
function bk(){if(!window.XLSX)return toast('Excel library not loaded');const a=[['Date','Model','Size','Type','Qty']];S.tx.forEach(t=>a.push([t.d,t.m,t.s,t.k.toUpperCase(),t.q]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Entries');dl('Polishing-Backup-'+td()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
